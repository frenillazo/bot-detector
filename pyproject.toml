[project]
name = "bot-detector"
version = "0.1.0"
description = "Medición de inautenticidad coordinada en la audiencia que interactúa con cuentas de redes sociales"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Pablo Calahorro" }]
keywords = ["desinformacion", "coordinated-inauthentic-behavior", "bot-detection", "osint"]

dependencies = [
    "duckdb>=1.1",
    "numpy>=2.0",
    "scipy>=1.14",
    "python-igraph>=0.11",
    "leidenalg>=0.10",
    "websockets>=13.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "typer>=0.12",
    "rich>=13.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
botdetector = "botdetector.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botdetector"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer declara las opciones como valores por defecto; es su API, no un descuido.
"src/botdetector/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
